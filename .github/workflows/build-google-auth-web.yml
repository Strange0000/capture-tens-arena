name: Build and commit Flutter web bundle

on:
  push:
    branches:
      - fix/google-auth-web
    paths-ignore:
      - "frontend/build/web/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flutter-web-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/google-auth-web
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.32.1"
          cache: true

      - name: Get dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Build production web app
        working-directory: frontend
        run: flutter build web --release

      - name: Commit rebuilt web bundle
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/build/web
          if git diff --cached --quiet; then
            echo "Build output unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "build(web): rebuild Google sign-in fix"
          git push origin HEAD:fix/google-auth-web
