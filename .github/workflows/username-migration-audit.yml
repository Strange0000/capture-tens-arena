name: Username migration audit (one-off)

# One-off helper for PR #15: runs the read-only username migration audit
# against production MongoDB. Triggered by hand only. Needs the MONGO_URI (re-run after the googleId index fix)
# repository secret (Actions secret). Remove this file after the migration.
on:
  workflow_dispatch:
  push:
    branches: [feat/unique-usernames]
    paths: ['.github/workflows/username-migration-audit.yml']

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/unique-usernames

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run username migration apply
        working-directory: backend
        run: npm run migrate:usernames -- apply
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
