apiVersion: apps/v1
kind: Deployment
metadata:
  name: capture-tens-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: capture-tens-backend
  template:
    metadata:
      labels:
        app: capture-tens-backend
    spec:
      containers:
        - name: backend
          image: capture-tens-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8080"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: capture-tens-secrets
                  key: JWT_SECRET
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: capture-tens-secrets
                  key: MONGO_URI
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: capture-tens-secrets
                  key: REDIS_URL
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: capture-tens-backend
spec:
  selector:
    app: capture-tens-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
