apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: capture-tens-backend
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  rules:
    - host: api.capture-tens.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: capture-tens-backend
                port:
                  number: 80
