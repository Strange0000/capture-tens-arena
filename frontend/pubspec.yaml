name: capture_tens_arena
description: Premium real-time multiplayer Capture Tens mobile card game.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  socket_io_client: ^2.0.3+1
  http: ^1.2.1
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  google_sign_in: ^6.2.1
  google_sign_in_web: ^0.12.4+4
  # Direct dependency: the GIS button wrapper reads the web plugin's
  # load state via GoogleSignInPlatform.instance (PR-A G6).
  google_sign_in_platform_interface: ^2.5.0
  just_audio: ^0.9.38
  confetti: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Test-only: the Google sign-in widget test fakes the platform with
  # MockPlatformInterfaceMixin (PR-A).
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/images/
